name: Docker CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Copy code to private EC2 via jump server
        run: |
          tar --exclude='.git' \
              --exclude='venv' \
              --exclude='__pycache__' \
              -czf python-app.tar.gz .

          scp -i ~/.ssh/ec2_key \
              -o StrictHostKeyChecking=no \
              python-app.tar.gz \
              ${{ secrets.JUMP_USER }}@${{ secrets.JUMP_HOST }}:/tmp/python-app.tar.gz

          ssh -i ~/.ssh/ec2_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.JUMP_USER }}@${{ secrets.JUMP_HOST }} << 'EOF'
            set -e

            scp -i ~/.ssh/ec2_key \
                -o StrictHostKeyChecking=no \
                /tmp/python-app.tar.gz \
                ${{ secrets.APP_USER }}@${{ secrets.APP_PRIVATE_IP }}:/tmp/python-app.tar.gz

            ssh -i ~/.ssh/ec2_key \
                -o StrictHostKeyChecking=no \
                ${{ secrets.APP_USER }}@${{ secrets.APP_PRIVATE_IP }} << 'INNER_EOF'
              set -e

              mkdir -p ~/python-app
              tar -xzf /tmp/python-app.tar.gz -C ~/python-app
              cd ~/python-app

              docker stop python-app || true
              docker rm python-app || true

              docker build -t python-app .
              docker run -d \
                --name python-app \
                --restart unless-stopped \
                -p 80:80 \
                python-app

              docker ps
            INNER_EOF
          EOF
